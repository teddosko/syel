services:
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metadata
    ports: ["5432:5432"]
    volumes:
      - app_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file: ../.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@app-db:5432/metadata
      APP_PORT: 4000
    depends_on: [app-db]
    ports: ["4000:4000"]

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    env_file: ../.env.example
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  app_db_data:
